name: roboshop
services:
  mongodb:
   build: ./mongodb
   image: noorawslearning/mongodb:3.0.0 
   container_name: mongodb

  catalogue:
   build: ./catalogue
   image: noorawslearning/catalogue:3.0.0
   container_name: catalogue
   environment:
    MONGO: true \
    MONGO_URL: "mongodb://mongodb:27017/catalogue"
   depends_on:
    - mongodb

  frontend:
   build: ./frontend
   image: noorawslearning/frontend:3.0.0
   container_name: frontend
   ports:
    - "80:80"
   depends_on:
    - catalogue
    - user
#     - cart
#     - shipping
#     - payment

  redis:
    image: redis:7
    container_name: redis

  user:
   build: ./user
   image: noorawslearning/user:3.0.0
   container_name: user
   environment:
    MONGO: true 
    MONGO_URL: "mongodb://mongodb:27017/user" 
    REDIS_URL: "redis://redis:6379"
   depends_on:
    - mongodb
    - redis

